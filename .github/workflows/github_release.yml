name: Publish GitHub Release (APK)

on:
  workflow_run:
    workflows: ["Google Play Store Closed Testing Release"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      versionName:
        description: 'Custom Version Name (e.g. 1.4). If omitted, uses existing versionName in build.gradle.kts.'
        required: false
        type: string
      versionCode:
        description: 'Custom Version Code (e.g. 5). If omitted, uses existing versionCode in build.gradle.kts.'
        required: false
        type: string
      bumpVersion:
        description: 'Bump version (minor version + 1, versionCode + 1) before releasing? Default: false (maintains exact same version).'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as Draft Release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Release Branch (if triggered by Play Store workflow)
        if: github.event_name == 'workflow_run'
        run: |
          git fetch --all --tags
          LATEST_RELEASE_BRANCH=$(git branch -r --list 'origin/release/*' --sort=-committerdate | head -n 1 | sed 's/origin\///' | tr -d ' ')
          if [ -n "$LATEST_RELEASE_BRANCH" ]; then
            echo "Checking out latest release branch: $LATEST_RELEASE_BRANCH"
            git checkout "$LATEST_RELEASE_BRANCH"
          else
            echo "No origin/release/* branch found, staying on default branch: $(git branch --show-current)"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve Version Code and Name
        id: version_info
        run: |
          python - << 'EOF'
          import re
          import os

          with open("app/build.gradle.kts", "r") as f:
              content = f.read()

          # Parse existing versionCode and versionName
          code_match = re.search(r'versionCode\s*=\s*(\d+)', content)
          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', content)

          if not code_match or not name_match:
              raise ValueError("Could not find versionCode or versionName in app/build.gradle.kts")

          current_code = int(code_match.group(1))
          current_name = name_match.group(1)

          input_code = "${{ github.event.inputs.versionCode }}".strip()
          input_name = "${{ github.event.inputs.versionName }}".strip()
          bump_flag = "${{ github.event.inputs.bumpVersion }}".strip().lower() == "true"
          ref_name = "${{ github.ref_name }}".strip()
          ref_type = "${{ github.ref_type }}".strip()

          tag_version = None
          if ref_type == "tag" and ref_name:
              tag_version = ref_name.lstrip("v")

          # Determine target versionCode
          if input_code:
              target_code = int(input_code)
          elif bump_flag:
              target_code = current_code + 1
          else:
              target_code = current_code

          # Determine target versionName
          if input_name:
              target_name = input_name
          elif tag_version:
              target_name = tag_version
          elif bump_flag:
              parts = current_name.split('.')
              if len(parts) >= 2:
                  parts[-1] = str(int(parts[-1]) + 1)
                  target_name = '.'.join(parts)
              else:
                  target_name = current_name + ".1"
          else:
              target_name = current_name

          # Update build.gradle.kts only if values have changed
          if target_code != current_code or target_name != current_name:
              content = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {target_code}', content)
              content = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{target_name}"', content)
              with open("app/build.gradle.kts", "w") as f:
                  f.write(content)
              print(f"Updated app/build.gradle.kts: versionCode={target_code}, versionName={target_name}")
          else:
              print(f"Keeping existing app/build.gradle.kts: versionCode={target_code}, versionName={target_name}")

          tag_name = f"v{target_name}"
          release_title = f"SideGlance v{target_name}"

          print(f"Target Tag: {tag_name}")
          print(f"Release Title: {release_title}")

          if "GITHUB_OUTPUT" in os.environ:
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"version_code={target_code}\n")
                  out.write(f"version_name={target_name}\n")
                  out.write(f"tag_name={tag_name}\n")
                  out.write(f"release_title={release_title}\n")
          EOF

      - name: Commit version bump (if modified)
        run: |
          if git diff --quiet app/build.gradle.kts; then
            echo "No changes in app/build.gradle.kts."
          else
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle.kts
            git commit -m "chore: Bump version to ${{ steps.version_info.outputs.version_name }} (code: ${{ steps.version_info.outputs.version_code }})"
            git push origin HEAD || echo "Could not push commit (possibly detached HEAD on tag push), proceeding with build."
          fi

      - name: Decrypt Keystore
        env:
          PLAY_STORE_KEYSTORE_BASE64: ${{ secrets.PLAY_STORE_KEYSTORE_BASE64 }}
        run: |
          echo "$PLAY_STORE_KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          echo "Decrypted keystore details:"
          ls -la app/keystore.jks
          md5sum app/keystore.jks || md5 app/keystore.jks || true

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Prepare Release Assets & Checksum
        run: |
          VERSION_NAME="${{ steps.version_info.outputs.version_name }}"
          APK_DIR="app/build/outputs/apk/release"
          SOURCE_APK="${APK_DIR}/app-release.apk"
          TARGET_APK="${APK_DIR}/SideGlance-v${VERSION_NAME}.apk"

          if [ ! -f "$SOURCE_APK" ]; then
            echo "Error: Release APK not found at $SOURCE_APK"
            exit 1
          fi

          cp "$SOURCE_APK" "$TARGET_APK"

          cd "$APK_DIR"
          sha256sum "SideGlance-v${VERSION_NAME}.apk" > "SideGlance-v${VERSION_NAME}.apk.sha256"
          echo "Generated SHA-256 Checksum:"
          cat "SideGlance-v${VERSION_NAME}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: ${{ steps.version_info.outputs.release_title }}
          body: |
            ## 📱 SideGlance v${{ steps.version_info.outputs.version_name }}
            
            - **Version Name**: `${{ steps.version_info.outputs.version_name }}`
            - **Version Code**: `${{ steps.version_info.outputs.version_code }}`
            - **Package**: `com.deep.sideglance`
            - **Release Type**: Production signed APK
            
            ### ⬇️ Downloads
            Download the signed APK below and install on Android (minSdk 29, Android 10+).
          files: |
            app/build/outputs/apk/release/SideGlance-v${{ steps.version_info.outputs.version_name }}.apk
            app/build/outputs/apk/release/SideGlance-v${{ steps.version_info.outputs.version_name }}.apk.sha256
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
