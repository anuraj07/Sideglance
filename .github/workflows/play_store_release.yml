name: Google Play Store Closed Testing Release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Custom Version Name (e.g. 1.2). If omitted, increments the minor number (e.g. 1.1 -> 1.2).'
        required: false
        type: string
      versionCode:
        description: 'Custom Version Code (e.g. 3). If omitted, increments current versionCode by 1.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bump Version Code and Name
        id: bump_version
        run: |
          python - << 'EOF'
          import re
          import os

          with open("app/build.gradle.kts", "r") as f:
              content = f.read()

          # Parse versionCode and versionName
          code_match = re.search(r'versionCode\s*=\s*(\d+)', content)
          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', content)

          if not code_match or not name_match:
              raise ValueError("Could not find versionCode or versionName in build.gradle.kts")

          current_code = int(code_match.group(1))
          current_name = name_match.group(1)

          input_code = "${{ github.event.inputs.versionCode }}".strip()
          input_name = "${{ github.event.inputs.versionName }}".strip()

          new_code = int(input_code) if input_code else current_code + 1

          if input_name:
              new_name = input_name
          else:
              parts = current_name.split('.')
              if len(parts) >= 2:
                  parts[-1] = str(int(parts[-1]) + 1)
                  new_name = '.'.join(parts)
              else:
                  new_name = current_name + ".1"

          # Replace in content
          content = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {new_code}', content)
          content = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{new_name}"', content)

          with open("app/build.gradle.kts", "w") as f:
              f.write(content)

          print(f"Bumped versionCode from {current_code} to {new_code}")
          print(f"Bumped versionName from {current_name} to {new_name}")

          # Write to GITHUB_OUTPUT
          if "GITHUB_OUTPUT" in os.environ:
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"new_version_code={new_code}\n")
                  out.write(f"new_version_name={new_name}\n")
          EOF

      - name: Create and Push Release Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH_NAME="release/${{ steps.bump_version.outputs.new_version_name }}"
          
          git checkout -b "$BRANCH_NAME"
          git add app/build.gradle.kts
          git commit -m "chore: Bump version to ${{ steps.bump_version.outputs.new_version_name }} (code: ${{ steps.bump_version.outputs.new_version_code }})"
          git push origin "$BRANCH_NAME" --force

      - name: Decrypt Keystore
        env:
          PLAY_STORE_KEYSTORE_BASE64: ${{ secrets.PLAY_STORE_KEYSTORE_BASE64 }}
        run: |
          echo "$PLAY_STORE_KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          echo "Decrypted keystore details:"
          ls -la app/keystore.jks
          md5sum app/keystore.jks || md5 app/keystore.jks || true

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Android App Bundle (AAB)
        run: ./gradlew :app:bundleRelease

      - name: Upload to Google Play Closed Testing (Alpha Track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.deep.sideglance
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: alpha
